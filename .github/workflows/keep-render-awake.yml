name: Keep Render API Warm

# Backup only. GitHub often delays or skips scheduled runs, so the API also pings itself
# (KeepAliveScheduler) and an outside pinger (cron-job.org / UptimeRobot) is recommended.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  keep-api-awake:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping health endpoint (waits out a cold start)
        run: |
          url="https://supportdesk-api-3evm.onrender.com/api/health"
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --connect-timeout 15 --max-time 90 "$url"; then
              echo
              echo "API is awake (attempt $attempt)"
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 10 seconds"
            sleep 10
          done
          echo "API did not respond after 3 attempts"
          exit 1
