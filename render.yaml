services:
  # Backend Spring Boot Web Service
  - type: web
    name: supportdesk-api
    runtime: docker
    dockerContext: backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: dev
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: DemoAdmin2026!
      - key: AGENT_USERNAME
        value: agent
      - key: AGENT_PASSWORD
        value: DemoAgent2026!

  # Frontend React/Vite Static Site
  - type: web
    runtime: static
    name: supportdesk-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE
        value: https://supportdesk-api-3evm.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
